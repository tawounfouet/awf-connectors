[project]
name = "pyconnectors"
version = "0.1.0"
description = "Universal framework for external service connectors."
authors = [{ name = "Jules", email = "jules@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
postgresql = ["psycopg[binary]"]
mysql = ["pymysql"]
mongodb = ["pymongo"]
redis = ["redis"]
s3 = ["boto3"]
gcs = ["google-cloud-storage"]
azure_blob = ["azure-storage-blob"]
adls = ["azure-storage-file-datalake"]
cloudinary = ["cloudinary"]
auth = ["PyJWT", "python3-saml"]
cli = ["typer", "rich"]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
    "black",
    "mypy"
]

[project.scripts]
pyconnectors = "pyconnectors.cli.app:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "pymysql",
    "pymongo",
    "redis",
    "psycopg",
    "boto3",
    "fastapi",
    "django",
    "google.cloud",
    "azure.storage.blob",
    "azure.storage.filedatalake",
    "cloudinary",
    "cloudinary.uploader",
    "jwt",
    "onelogin.saml2.auth"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
